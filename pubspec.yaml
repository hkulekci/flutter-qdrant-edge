name: qdrant_edge_flutter
description: "On-device Qdrant vector database for Flutter: dense, sparse (BM25) and hybrid search with filters, grouping and payloads, fully offline."
version: 0.2.0
repository: https://github.com/hkulekci/flutter-qdrant-edge
homepage: https://github.com/hkulekci/flutter-qdrant-edge
issue_tracker: https://github.com/hkulekci/flutter-qdrant-edge/issues
topics:
  - vector-database
  - search
  - embeddings
  - offline
  - ffi

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
